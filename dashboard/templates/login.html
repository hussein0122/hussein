<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول الأدمن | ShortsPilot</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#f4f6ff;font-family:Tahoma,Arial,sans-serif;padding:20px}
.card{width:min(420px,100%);background:#151d32;border:1px solid #293552;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}
h1{font-size:24px;margin:0 0 8px}.muted{color:#a9b5ce;font-size:14px;margin-bottom:24px}
label{display:block;margin:16px 0 7px;font-size:14px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #354563;background:#0d1528;color:white;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#6d8cff;color:#071126;font-weight:bold;font-size:16px}
.error{background:#4b202d;color:#ffd9df;padding:12px;border-radius:9px;margin-top:14px;font-size:14px}
</style></head>
<body><main class="card"><h1>ShortsPilot AR</h1><p class="muted">لوحة التحكم — دخول الأدمن المصرّح به فقط</p>
<form method="post" autocomplete="on">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label for="email">البريد الإلكتروني</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">كلمة مرور لوحة التحكم</label><input id="password" name="password" type="password" autocomplete="current-password" required>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<button type="submit">تسجيل الدخول</button></form></main></body></html>
