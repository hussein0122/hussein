name: One-off 5 minute drama episode

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-off-drama-episode
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install episode dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'edge-tts>=7.0,<8'

      - name: Verify required secrets without displaying values
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for name in AGNES_API_KEY YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          echo "Required secrets are present; values were not printed."

      - name: Generate one 5-minute Arabic drama and upload Public
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_VIDEO_MODEL: agnes-video-2.5-flash
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python episode_once.py

      - name: Save episode output for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-off-drama-episode-${{ github.run_id }}
          path: episode_output/
          if-no-files-found: warn
          retention-days: 14
