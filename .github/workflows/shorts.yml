name: Arabic Shorts - safe test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shorts.yml'

permissions:
  contents: read

concurrency:
  group: shorts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check required credentials
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          test -n "$YT_REFRESH_TOKEN" || { echo "::error::Add YT_REFRESH_TOKEN in repository Actions secrets."; exit 1; }
          test -n "$YT_CLIENT_ID" || { echo "::error::Add YT_CLIENT_ID in repository Actions secrets."; exit 1; }
          test -n "$YT_CLIENT_SECRET" || { echo "::error::Add YT_CLIENT_SECRET in repository Actions secrets."; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "::error::Add GEMINI_API_KEY from Google AI Studio. Use a free-tier key; do not enable paid billing."; exit 1; }
          test -n "$PIXABAY_API_KEY" || { echo "::error::Add PIXABAY_API_KEY in repository Actions secrets."; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PurffleShorts engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Chamanrajragu/purffle-shorts.git"
          python -m pip install -r requirements.txt

      - name: Validate and restore YouTube authorization
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os, sys
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from pathlib import Path

          scopes = ['https://www.googleapis.com/auth/youtube.upload']
          creds = Credentials(
              token=None,
              refresh_token=os.environ['YT_REFRESH_TOKEN'].strip(),
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YT_CLIENT_ID'].strip(),
              client_secret=os.environ['YT_CLIENT_SECRET'].strip(),
              scopes=scopes,
          )
          try:
              creds.refresh(Request())
          except Exception as exc:
              print('::error::YouTube OAuth refresh failed before video rendering.')
              print('The refresh token is invalid, revoked, expired, or does not belong to the configured OAuth client.')
              print('Create a new refresh token using the exact same Google OAuth client ID and client secret saved in GitHub Secrets.')
              print(f'Google response: {type(exc).__name__}: {exc}')
              sys.exit(1)
          Path('token.json').write_text(creds.to_json(), encoding='utf-8')
          print('YouTube authorization validated and access token refreshed successfully.')
          PY

      - name: Check FFmpeg renderer
        run: |
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          binary = imageio_ffmpeg.get_ffmpeg_exe()
          print("FFmpeg binary:", binary)
          result = subprocess.run([binary, "-version"], capture_output=True, text=True, check=True)
          print("\n".join(result.stdout.splitlines()[:3]))
          PY

      - name: Generate one private Arabic test Short
        env:
          LANGUAGE: ar
          NICHES: "حقائق علمية,تاريخ,فضاء,تكنولوجيا,ألغاز,حيوانات,معلومات عامة"
          TOPIC_SOURCES: niche
          SCRIPT_STYLE: auto
          SCRIPT_REVIEW: rewrite
          SCRIPT_REVIEW_ROUNDS: "1"
          SCRIPT_TARGET_SCORE: "80"
          TARGET_SECONDS: "35"
          CHANNEL_NAME: ShortsPilot AR
          AUDIENCE: الجمهور العربي
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_ENGINE: edge
          TTS_VOICE: ar-EG-SalmaNeural
          TTS_RATE: "+5%"
          VISUAL_SOURCES: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ASPECT: "9:16"
          RESOLUTION: 1080x1920
          FPS: "30"
          CAPTION_STYLE: karaoke
          CAPTION_POSITION: center
          CAPTION_MAX_WORDS: "3"
          COLOR_GRADE: vivid
          TRANSITION: none
          VIDEO_ENCODER: libx264
          SOUND_EFFECTS: "true"
          VOICE_ENHANCE: "true"
          MUSIC_VOLUME: "0.10"
          END_CTA: "تابعنا للمزيد"
          UPLOAD: "true"
          YT_PRIVACY: private
          YT_DAILY_LIMIT: "1"
          SYNTHETIC_MEDIA: "true"
          KEEP_VIDEOS: "true"
          OUTPUT_DIR: output_videos
          TIMEZONE: Africa/Cairo
        run: python bot.py

      - name: Save generated video and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-pilot-test-${{ github.run_id }}
          path: |
            output_videos/
            data/
          if-no-files-found: warn
          retention-days: 7
