name: Arabic Shorts - safe test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shorts.yml'
      - 'bot.py'
      - 'analytics_report.py'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: shorts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_DIR: data
      OUTPUT_DIR: output_videos
      TIMEZONE: Africa/Cairo
    steps:
      - uses: actions/checkout@v4

      - name: Restore channel history
        uses: actions/cache@v4
        with:
          path: data
          key: shorts-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            shorts-history-${{ github.ref_name }}-

      - name: Check required credentials
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          for name in YT_REFRESH_TOKEN YT_CLIENT_ID YT_CLIENT_SECRET GEMINI_API_KEY PIXABAY_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          echo "All required secrets are present (values are never printed)."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned video engine and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "purffle-shorts==3.0.0"
          python -m pip install -r requirements.txt

      - name: Validate YouTube upload, channel-read and Analytics access
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python oauth_check.py

      - name: Check Gemini free-tier model access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: gemini-2.5-flash
        run: python check_gemini.py

      - name: Check FFmpeg renderer
        run: |
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          binary = imageio_ffmpeg.get_ffmpeg_exe()
          result = subprocess.run([binary, "-version"], capture_output=True, text=True, check=True)
          print("FFmpeg ready:", result.stdout.splitlines()[0])
          PY

      - name: Collect channel Analytics before generation
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python analytics_report.py

      - name: Generate one private Arabic test Short
        env:
          LANGUAGE: ar
          NICHES: "حقائق علمية,تاريخ,فضاء,تكنولوجيا,ألغاز,حيوانات,معلومات عامة"
          TOPIC_SOURCES: niche
          SCRIPT_STYLE: auto
          SCRIPT_REVIEW: rewrite
          SCRIPT_REVIEW_ROUNDS: "1"
          SCRIPT_TARGET_SCORE: "80"
          TARGET_SECONDS: "35"
          CHANNEL_NAME: ShortsPilot AR
          AUDIENCE: الجمهور العربي
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-2.5-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LEARN_FROM_STATS: "true"
          TTS_ENGINE: edge
          TTS_VOICE: ar-EG-SalmaNeural
          TTS_RATE: "+5%"
          VISUAL_SOURCES: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ASPECT: "9:16"
          RESOLUTION: 1080x1920
          FPS: "30"
          CAPTION_STYLE: karaoke
          CAPTION_POSITION: center
          CAPTION_MAX_WORDS: "3"
          COLOR_GRADE: vivid
          TRANSITION: none
          VIDEO_ENCODER: libx264
          SOUND_EFFECTS: "true"
          VOICE_ENHANCE: "true"
          MUSIC_VOLUME: "0.10"
          END_CTA: "تابعنا للمزيد"
          UPLOAD: "true"
          YT_PRIVACY: private
          YT_DAILY_LIMIT: "1"
          SYNTHETIC_MEDIA: "true"
          KEEP_VIDEOS: "true"
          OUTPUT_DIR: output_videos
          DATA_DIR: data
          TIMEZONE: Africa/Cairo
        run: python bot.py

      - name: Save generated video, channel history and Analytics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-pilot-test-${{ github.run_id }}
          path: |
            output_videos/
            data/
          if-no-files-found: warn
          retention-days: 14
