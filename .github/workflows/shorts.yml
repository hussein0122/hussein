name: Arabic Shorts - safe test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check required credentials
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          test -n "$YT_REFRESH_TOKEN" || { echo "::error::Add YT_REFRESH_TOKEN in repository Actions secrets."; exit 1; }
          test -n "$YT_CLIENT_ID" || { echo "::error::Add YT_CLIENT_ID in repository Actions secrets."; exit 1; }
          test -n "$YT_CLIENT_SECRET" || { echo "::error::Add YT_CLIENT_SECRET in repository Actions secrets."; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "::error::Add GEMINI_API_KEY from Google AI Studio. Use a free-tier key; do not enable paid billing."; exit 1; }
          if [ -z "$PEXELS_API_KEY" ] && [ -z "$PIXABAY_API_KEY" ]; then
            echo "::error::Add at least one free visual API key: PEXELS_API_KEY or PIXABAY_API_KEY."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PurffleShorts engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Chamanrajragu/purffle-shorts.git"
          python -m pip install -r requirements.txt

      - name: Verify Gemini API key without exposing it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: gemini-2.5-flash
        run: python check_gemini.py

      - name: Restore YouTube authorization
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          token = {
              'token': '',
              'expiry': '2000-01-01T00:00:00Z',
              'refresh_token': os.environ['YT_REFRESH_TOKEN'],
              'token_uri': 'https://oauth2.googleapis.com/token',
              'client_id': os.environ['YT_CLIENT_ID'],
              'client_secret': os.environ['YT_CLIENT_SECRET'],
              'scopes': ['https://www.googleapis.com/auth/youtube.upload'],
          }
          with open('token.json', 'w', encoding='utf-8') as f:
              json.dump(token, f)
          PY

      - name: Generate one private Arabic test Short
        env:
          LANGUAGE: ar
          NICHES: "حقائق علمية,تاريخ,فضاء,تكنولوجيا,ألغاز,حيوانات,معلومات عامة"
          TOPIC_SOURCES: niche
          SCRIPT_STYLE: auto
          SCRIPT_REVIEW: rewrite
          SCRIPT_REVIEW_ROUNDS: "1"
          SCRIPT_TARGET_SCORE: "80"
          TARGET_SECONDS: "35"
          CHANNEL_NAME: ShortsPilot AR
          AUDIENCE: الجمهور العربي
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-2.5-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_ENGINE: edge
          TTS_VOICE: ar-EG-SalmaNeural
          TTS_RATE: "+5%"
          VISUAL_SOURCES: pixabay
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ASPECT: "9:16"
          RESOLUTION: 1080x1920
          FPS: "30"
          CAPTION_STYLE: karaoke
          CAPTION_POSITION: center
          CAPTION_MAX_WORDS: "3"
          COLOR_GRADE: vivid
          TRANSITION: random
          SOUND_EFFECTS: "true"
          VOICE_ENHANCE: "true"
          MUSIC_VOLUME: "0.10"
          END_CTA: "تابعنا للمزيد"
          UPLOAD: "true"
          YT_PRIVACY: private
          YT_DAILY_LIMIT: "1"
          SYNTHETIC_MEDIA: "true"
          KEEP_VIDEOS: "true"
          OUTPUT_DIR: output_videos
          TIMEZONE: Africa/Cairo
        run: python bot.py

      - name: Save generated video and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-pilot-test-${{ github.run_id }}
          path: |
            output_videos/
            data/
          if-no-files-found: warn
          retention-days: 7
