name: ShortsPilot AR - Automated Arabic Shorts

on:
  schedule:
    - cron: "0 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_DIR: data
      OUTPUT_DIR: output_videos
      TIMEZONE: Africa/Cairo
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent data directories
        run: mkdir -p data output_videos
      - name: Restore channel history
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            output_videos
          key: shorts-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            shorts-history-${{ github.ref_name }}-
      - name: Check required credentials
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          for name in YT_REFRESH_TOKEN YT_CLIENT_ID YT_CLIENT_SECRET PIXABAY_API_KEY GROQ_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          echo "All required secrets are present (values are never printed)."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned video engine and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Chamanrajragu/purffle-shorts.git@38d49cd956319a73cf983153816acdbda3dc0e0c"
          python -m pip install -r requirements.txt
      - name: Apply and verify Shorts quality patches
        run: |
          python patch_engine.py
          python - <<'PY'
          import compileall
          import importlib.util
          from pathlib import Path
          spec = importlib.util.find_spec("purffle_shorts")
          if not spec or not spec.submodule_search_locations:
              raise RuntimeError("purffle_shorts package path not found")
          package_dir = Path(next(iter(spec.submodule_search_locations)))
          if not compileall.compile_dir(str(package_dir), quiet=1, force=True):
              raise RuntimeError(f"Compilation failed for {package_dir}")
          print("Installed engine compilation: OK", package_dir)
          PY
          # A second pass must be idempotent; imports must succeed before any API calls.
          python patch_engine.py
          python - <<'PY'
          from purffle_shorts import config, llm, media, pipeline, script, utils
          print("Preflight imports: OK")
          print("LLM retry helper:", utils.with_retries.__name__)
          PY
      - name: Check Gemini free-tier model access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python check_gemini.py
        continue-on-error: true
      - name: Check FFmpeg renderer
        run: |
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          binary = imageio_ffmpeg.get_ffmpeg_exe()
          result = subprocess.run([binary, "-version"], capture_output=True, text=True, check=True)
          print("FFmpeg ready:", result.stdout.splitlines()[0])
          PY
      - name: Validate YouTube upload, channel-read and Analytics access
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python oauth_check.py
      - name: Collect channel Analytics before generation
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python analytics_report.py
        continue-on-error: true
      - name: Generate one public Arabic curiosity Short
        env:
          LANGUAGE: ar
          NICHES: "غرائب الحيوانات,ماذا لو؟,أسرار جسم الإنسان,ألغاز علمية,ظواهر طبيعية غريبة,أسرار الفضاء,تاريخ غامض,اختراعات غيرت العالم,أسرار المحيطات,حقائق مذهلة"
          TOPIC_SOURCES: "search:3,niche:5,reddit:2,trending:1,wikipedia:1"
          TRENDS_GEO: EG
          SCRIPT_STYLE: auto
          SCRIPT_REVIEW: rewrite
          SCRIPT_REVIEW_ROUNDS: "2"
          SCRIPT_MIN_SCORE: "80"
          SCRIPT_TARGET_SCORE: "80"
          TARGET_SECONDS: "35"
          CHANNEL_NAME: ShortsPilot AR
          AUDIENCE: الجمهور العربي
          LLM_PROVIDER: groq
          LLM_MODEL: "openai/gpt-oss-120b"
          LLM_FALLBACKS: "openrouter,deepseek,gemini"
          LLM_MAX_RETRY_WAIT: "45"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LEARN_FROM_STATS: "true"
          TTS_ENGINE: edge
          TTS_VOICE: ar-EG-ShakirNeural
          TTS_RATE: "+2%"
          VISUAL_SOURCES: pixabay,pixabay-photos
          WATERMARK: off
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ASPECT: "9:16"
          RESOLUTION: 1080x1920
          FPS: "30"
          CAPTION_STYLE: karaoke
          CAPTION_POSITION: lower
          CAPTION_UPPERCASE: "false"
          CAPTION_MAX_WORDS: "3"
          COLOR_GRADE: cinematic
          TRANSITION: fade
          TRANSITION_SECONDS: "0.28"
          MAX_SHOT_SECONDS: "2.8"
          KEN_BURNS: "true"
          VIDEO_ENCODER: libx264
          SOUND_EFFECTS: "true"
          VOICE_ENHANCE: "true"
          MUSIC_VOLUME: "0.08"
          END_CTA: "تابعنا للمزيد"
          UPLOAD: "true"
          YT_PRIVACY: public
          YT_DAILY_LIMIT: "3"
          SYNTHETIC_MEDIA: "true"
          KEEP_VIDEOS: "true"
          OUTPUT_DIR: output_videos
          DATA_DIR: data
          TIMEZONE: Africa/Cairo
        run: python bot.py
      - name: Reply to recent YouTube comments
        if: success()
        env:
          YT_COMMENTS_TOKEN_JSON: ${{ secrets.YT_COMMENTS_TOKEN_JSON }}
          AUTO_REPLY_ENABLED: "true"
          AUTO_REPLY_DAILY_LIMIT: "20"
          COMMENT_DB: data/comment_replies.sqlite3
        run: |
          set -euo pipefail
          if [ -z "${YT_COMMENTS_TOKEN_JSON:-}" ]; then
            echo "::warning::Comment replies skipped: YT_COMMENTS_TOKEN_JSON is not configured."
            exit 0
          fi
          printf '%s' "$YT_COMMENTS_TOKEN_JSON" > comment_token.json
          chmod 600 comment_token.json
          python comment_replies.py
          rm -f comment_token.json
      - name: Save generated video, channel history and Analytics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-pilot-test-${{ github.run_id }}
          path: |
            output_videos/
            data/
          if-no-files-found: warn
          retention-days: 14
      - name: Prune completed videos before cache
        if: always()
        run: python prune_outputs.py
      - name: Save channel history and pending videos cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            output_videos
          key: shorts-history-${{ github.ref_name }}-${{ github.run_id }}
